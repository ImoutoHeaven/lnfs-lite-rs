name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish Linux release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Build and verify package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo +1.92.0 build --locked --release
          python3 scripts/package_release.py --tag "$RELEASE_TAG"
          cd dist
          sha256sum --check SHA256SUMS
          tar -tzf *.tar.gz
      - name: Preserve release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "Lnfs-Lite $RELEASE_TAG" \
            --notes-file CHANGELOG.md
